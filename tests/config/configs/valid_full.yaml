llms:
  gemini_default:
    provider: gemini
    model: gemini-2.5-pro
    api_key: ${GEMINI_API_KEY}
    extra:
      temperature: 0.7

  groq_fast:
    provider: groq
    model: llama-3.1-70b
    extra:
      temperature: 0.2
      max_tokens: 2048

mcp_servers:
  - name: filesystem
    url: http://localhost:8901
  - name: search
    url: http://localhost:8902

agents:
  researcher:
    llm: gemini_default
    tools:
      - web_search
      - retrieve_knowledge
    prompt: |
      You are a careful researcher. Cite your sources.
    memory: researcher_memory
    skills_directory: skills/researcher
    knowledge_directory: knowledge/researcher
    peers:
      - writer
    streaming_on: true
    expose_a2a: false

  writer:
    llm: groq_fast
    tools:
      - lc_send_file
    prompt_file: prompts/writer_system_prompt.txt
    peers:
      - researcher
    expose_a2a: true